<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 9-slice recessed field (slice 16, used with `fill`): chamfered bronze
       bevel around a dark, inset face. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4224"/>
      <stop offset="0.5" stop-color="#b8904c"/>
      <stop offset="1" stop-color="#6b4f26"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050707"/>
      <stop offset="0.35" stop-color="#0b100f"/>
      <stop offset="1" stop-color="#101614"/>
    </linearGradient>
  </defs>
  <!-- outer shadow -->
  <path d="M10 0.5 H54 L63.5 10 V54 L54 63.5 H10 L0.5 54 V10 Z" fill="#000" opacity="0.7"/>
  <!-- bronze rim -->
  <path d="M10 1.5 H54 L62.5 10 V54 L54 62.5 H10 L1.5 54 V10 Z" fill="url(#rim)"/>
  <!-- dark channel + inner hairline -->
  <path d="M10.6 3 H53.4 L61 10.6 V53.4 L53.4 61 H10.6 L3 53.4 V10.6 Z" fill="#17110a"/>
  <path d="M11.2 4.5 H52.8 L59.5 11.2 V52.8 L52.8 59.5 H11.2 L4.5 52.8 V11.2 Z" fill="#6f532a"/>
  <!-- face -->
  <path d="M11.6 5.5 H52.4 L58.5 11.6 V52.4 L52.4 58.5 H11.6 L5.5 52.4 V11.6 Z" fill="url(#face)"/>
</svg>
