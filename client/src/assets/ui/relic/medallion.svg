<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top-left panel medallion: bronze ring, compass rose, teal gem. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c47f"/>
      <stop offset="0.5" stop-color="#8f6831"/>
      <stop offset="1" stop-color="#3b2a12"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#16302c"/>
      <stop offset="1" stop-color="#070b0a"/>
    </radialGradient>
    <radialGradient id="gem" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d4fff6"/>
      <stop offset="0.4" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#08453d"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer spikes (8-point) -->
  <g fill="url(#ring)" stroke="#140c04" stroke-width="0.8">
    <path d="M50 1 L55 16 L45 16 Z"/>
    <path d="M50 99 L55 84 L45 84 Z"/>
    <path d="M1 50 L16 45 L16 55 Z"/>
    <path d="M99 50 L84 45 L84 55 Z"/>
    <g transform="rotate(45 50 50)">
      <path d="M50 6 L54 18 L46 18 Z"/>
      <path d="M50 94 L54 82 L46 82 Z"/>
      <path d="M6 50 L18 46 L18 54 Z"/>
      <path d="M94 50 L82 46 L82 54 Z"/>
    </g>
  </g>

  <circle cx="50" cy="50" r="36" fill="url(#ring)" stroke="#120a03" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="31.5" fill="url(#face)" stroke="#c49a55" stroke-width="1"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#a8803f" stroke-opacity="0.55" stroke-width="0.7" stroke-dasharray="1.5 2.5"/>

  <!-- compass rose -->
  <g fill="#b8904c" opacity="0.9">
    <path d="M50 21 L53 47 L50 50 L47 47 Z"/>
    <path d="M50 79 L53 53 L50 50 L47 53 Z"/>
    <path d="M21 50 L47 47 L50 50 L47 53 Z"/>
    <path d="M79 50 L53 47 L50 50 L53 53 Z"/>
  </g>
  <g fill="#6f5228" opacity="0.9" transform="rotate(45 50 50)">
    <path d="M50 30 L52 48 L50 50 L48 48 Z"/>
    <path d="M50 70 L52 52 L50 50 L48 52 Z"/>
    <path d="M30 50 L48 48 L50 50 L48 52 Z"/>
    <path d="M70 50 L52 48 L50 50 L52 52 Z"/>
  </g>

  <circle cx="50" cy="50" r="15" fill="url(#halo)"/>
  <circle cx="50" cy="50" r="7" fill="url(#gem)" stroke="#06201c" stroke-width="1"/>
  <ellipse cx="48" cy="47.5" rx="2.4" ry="1.5" fill="#fff" opacity="0.6"/>

  <!-- small gems at the cardinal points of the ring -->
  <g fill="url(#gem)" stroke="#06201c" stroke-width="0.6">
    <circle cx="50" cy="16.5" r="2.2"/>
    <circle cx="50" cy="83.5" r="2.2"/>
    <circle cx="16.5" cy="50" r="2.2"/>
    <circle cx="83.5" cy="50" r="2.2"/>
  </g>
</svg>
