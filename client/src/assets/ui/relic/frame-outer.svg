<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 160" width="160" height="160">
  <!-- 9-slice outer panel frame. Slice = 48 on every side: corners are ornate,
       the 48..112 band is uniform so it can stretch. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2bd78"/>
      <stop offset="0.45" stop-color="#9a7238"/>
      <stop offset="1" stop-color="#4a3418"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d5c2e"/>
      <stop offset="1" stop-color="#2c1f0f"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="0.45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0b4d45"/>
    </radialGradient>

    <g id="corner">
      <!-- spikes running along both edges -->
      <path d="M20 5 L47 9 L20 13 Z" fill="url(#metal)" stroke="#1a1006" stroke-width="0.8"/>
      <path d="M5 20 L9 47 L13 20 Z" fill="url(#metal)" stroke="#1a1006" stroke-width="0.8"/>
      <!-- filigree scrolls curling into the panel -->
      <path d="M21 21 C30 20 36 24 37 31 C37.5 35 34 37 31.5 35 C29.5 33.5 31 31 33 32"
            fill="none" stroke="#b8904c" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M21 21 C20 30 24 36 31 37 C35 37.5 37 34 35 31.5 C33.5 29.5 31 31 32 33"
            fill="none" stroke="#b8904c" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
      <circle cx="40" cy="15.5" r="1.3" fill="#d9b46c"/>
      <circle cx="15.5" cy="40" r="1.3" fill="#d9b46c"/>
      <!-- corner boss -->
      <rect x="1" y="1" width="23" height="23" rx="1.5" fill="url(#metal)" stroke="#120b04" stroke-width="1"/>
      <rect x="4.5" y="4.5" width="16" height="16" fill="url(#metalDark)" stroke="#e7c27e" stroke-opacity="0.45" stroke-width="0.7"/>
      <path d="M12.5 6.5 L18.5 12.5 L12.5 18.5 L6.5 12.5 Z" fill="url(#gem)" stroke="#071a17" stroke-width="0.8"/>
      <path d="M12.5 8 L14.2 11 L12.5 12.2 Z" fill="#ffffff" opacity="0.55"/>
    </g>
  </defs>

  <!-- rails (layered strokes give a bevel without stretch artefacts) -->
  <rect x="2" y="2" width="156" height="156" fill="none" stroke="#040403" stroke-width="2"/>
  <rect x="9" y="9" width="142" height="142" fill="none" stroke="#21190f" stroke-width="10"/>
  <rect x="4.6" y="4.6" width="150.8" height="150.8" fill="none" stroke="#8c6a36" stroke-width="1"/>
  <rect x="8" y="8" width="144" height="144" fill="none" stroke="#3a2c18" stroke-width="0.8"/>
  <rect x="13.6" y="13.6" width="132.8" height="132.8" fill="none" stroke="#5a4224" stroke-width="1"/>
  <rect x="17.5" y="17.5" width="125" height="125" fill="none" stroke="#a8803f" stroke-opacity="0.75" stroke-width="1"/>
  <rect x="19.5" y="19.5" width="121" height="121" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="1.5"/>

  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 1 160 0)"/>
  <use xlink:href="#corner" transform="matrix(1 0 0 -1 0 160)"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 -1 160 160)"/>
</svg>
