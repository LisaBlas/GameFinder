<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="120" height="120">
  <!-- 9-slice map-window frame (slice 40): thin bronze double rail with
       filigree corners and a small teal gem. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2bd78"/>
      <stop offset="0.5" stop-color="#8c6a36"/>
      <stop offset="1" stop-color="#3f2c14"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c8fff4"/>
      <stop offset="0.45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0b4d45"/>
    </radialGradient>
    <g id="corner">
      <!-- swept filigree leaves -->
      <path d="M3 3 C14 4 24 6 37 6.5 C27 8.5 17 9 11 11 C9 17 8.5 27 6.5 37 C6 24 4 14 3 3 Z"
            fill="url(#metal)" stroke="#140c04" stroke-width="0.6"/>
      <path d="M11 11 C17 12 20 16 19 21 C18.4 24 15 24.5 14 22.5"
            fill="none" stroke="#c49a55" stroke-width="1" stroke-linecap="round"/>
      <path d="M11 11 C12 17 16 20 21 19 C24 18.4 24.5 15 22.5 14"
            fill="none" stroke="#c49a55" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
      <path d="M8 4 L11 8 L8 12 L5 8 Z" fill="url(#gem)" stroke="#06201c" stroke-width="0.5" transform="rotate(-45 8 8)"/>
    </g>
  </defs>

  <rect x="1" y="1" width="118" height="118" fill="none" stroke="#000" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="2.5" y="2.5" width="115" height="115" fill="none" stroke="#a8803f" stroke-width="1.4"/>
  <rect x="4.5" y="4.5" width="111" height="111" fill="none" stroke="#2a1f10" stroke-width="1.6"/>
  <rect x="6.5" y="6.5" width="107" height="107" fill="none" stroke="#6f532a" stroke-opacity="0.8" stroke-width="0.8"/>

  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 1 120 0)"/>
  <use xlink:href="#corner" transform="matrix(1 0 0 -1 0 120)"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 -1 120 120)"/>
</svg>
